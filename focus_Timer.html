<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="작업 타이머">
<title>작업 타이머</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#2563eb;--accent-light:#dbeafe;--accent-border:#93bbfd;
  --text:#1a1a18;--muted:#9a9a92;
  --surface:#fff;--alt:#f6f6f3;
  --border:#e2e2dc;--border-l:#eeeeea;--bg:#fafaf8;
  --ok:#16a34a;--ok-l:#dcfce7;--ok-b:#86efac;
  --danger:#dc2626;
}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--text);
  min-height:100dvh;-webkit-user-select:none;user-select:none;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(env(safe-area-inset-bottom)+56px);overflow-x:hidden}
input,select{-webkit-user-select:text;user-select:text;font-family:inherit}
input::placeholder{color:var(--muted);opacity:.5}

/* HEADER */
.hdr{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:50}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
.hdr h1{font-size:20px;font-weight:800;letter-spacing:-.03em}
.hdr .dt{margin-top:3px;font-size:13px;color:var(--muted);font-weight:500}
.btn-reset{background:var(--alt);color:var(--muted);border:1px solid var(--border);border-radius:8px;
  padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-reset:hover{border-color:var(--danger);color:var(--danger)}

/* DAY GAUGE */
.day-wrap{max-width:640px;margin:10px auto 0}
.day-labels{display:flex;justify-content:space-between;font-size:10px;font-weight:600;color:var(--muted);margin-bottom:4px}
.day-track{height:8px;border-radius:4px;background:var(--border-l);overflow:hidden}
.day-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#93c5fd,#2563eb);transition:width 30s linear}
.day-rem{text-align:center;font-size:11px;font-weight:700;color:var(--accent);margin-top:4px}

/* TASK/TIME BARS */
.prog-wrap{display:flex;gap:20px;margin-top:10px;max-width:640px;margin-left:auto;margin-right:auto}
.prog-bar{flex:1}
.prog-bar .info{display:flex;justify-content:space-between;margin-bottom:4px;font-size:11px;font-weight:600}
.prog-bar .lbl{color:var(--muted)}
.prog-bar .trk{height:6px;border-radius:3px;background:var(--border-l);overflow:hidden}
.prog-bar .fil{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#60a5fa);transition:width .4s}
.prog-bar .fil.done{background:linear-gradient(90deg,#16a34a,#22c55e)}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);
  display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:10px 0 8px;background:none;border:none;font-family:inherit;
  font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s}
.nav-btn .ic{font-size:19px;line-height:1}
.nav-btn.on{color:var(--accent)}

/* PAGES */
.pages-outer{width:100%;overflow:hidden}
.pages-inner{display:flex;transition:transform .3s cubic-bezier(.4,0,.2,1)}
/* width set by JS */
.pg{flex:0 0 100vw;padding:20px;min-height:60vh}
.pg-inner{max-width:640px;margin:0 auto}
.sec-title{font-size:15px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px}

/* COLOR DOTS */
.palette{display:flex;gap:6px;align-items:center}
.cdot{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0}
.cdot:hover{transform:scale(1.15)}
.cdot.sel{border-color:#1a1a18;transform:scale(1.1)}

/* TASK CARDS */
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;transition:box-shadow .2s}
.task-card.act{box-shadow:0 0 0 3px var(--_cl,var(--accent-light));border-color:var(--_cb,var(--accent-border))}
.task-card.done{opacity:.5}
.task-card.done .tname{text-decoration:line-through;color:var(--muted)}
.tclr-bar{height:3px;width:100%}
.thead{display:flex;align-items:center;gap:8px;padding:10px 12px}
.tnum{font-size:11px;font-weight:700;color:var(--muted);width:16px;flex-shrink:0;text-align:center}
.tchk{width:18px;height:18px;flex-shrink:0;border:1.5px solid var(--border);border-radius:50%;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.tchk.on{color:white}
.tname{flex:1;background:transparent;border:none;outline:none;font-family:inherit;font-size:14px;font-weight:500;color:var(--text)}
.bdg{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;flex-shrink:0}
.bdg-g{color:var(--muted);background:var(--alt);border:1px solid var(--border);font-weight:600}
.tdel{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;opacity:.4;transition:opacity .15s}
.tdel:hover{opacity:1;color:var(--danger)}
.tbottom{padding:8px 12px 12px 36px;border-top:1px solid var(--border-l)}
.srow{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.srow:last-child{margin-bottom:0}
.slbl{font-size:12px;color:var(--muted);font-weight:500}
.sinp{background:var(--alt);border:1px solid var(--border);border-radius:6px;padding:4px 8px;
  font-size:12px;font-weight:600;color:var(--text);width:46px;text-align:center;outline:none}
.sinp:focus{border-color:var(--accent)}
.btn-go{padding:5px 16px;color:white;border:none;border-radius:7px;font-family:inherit;
  font-size:12px;font-weight:700;cursor:pointer;transition:filter .15s;margin-left:auto}
.btn-go:hover{filter:brightness(1.1)}
.btn-go:disabled{background:#d1d5db!important;color:#9a9a92;cursor:not-allowed;filter:none}
.add-btn{width:100%;padding:10px;background:transparent;border:1.5px dashed var(--border);
  border-radius:10px;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s;margin-bottom:20px}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}

/* SUMMARY */
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sbox{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.sval{font-size:22px;font-weight:800;letter-spacing:-.03em}
.slb{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.card-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-lbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.btn-clr{font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600;padding:2px 6px}
.btn-clr:hover{color:var(--danger)}

/* LOG */
.log-ul{list-style:none}
.log-li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border-l);font-size:13px}
.log-li:last-child{border-bottom:none}
.log-t{font-size:11px;color:var(--muted);font-weight:500;width:38px;flex-shrink:0}
.log-n{flex:1;font-weight:500}
.log-d{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px}
.log-x{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;opacity:.35;flex-shrink:0}
.log-x:hover{opacity:1;color:var(--danger)}

.bot-row{display:flex;gap:8px;padding-top:14px}
.btn-ghost{background:var(--alt);border:1px solid var(--border);border-radius:8px;padding:7px 14px;
  font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

/* TODO */
.todo-row{display:flex;gap:6px;margin-bottom:12px}
.todo-inp{flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  font-size:13px;color:var(--text);outline:none}
.todo-inp:focus{border-color:var(--accent)}
.btn-add{background:var(--accent);color:white;border:none;border-radius:8px;padding:8px 14px;
  font-size:13px;font-weight:600;cursor:pointer}
.td-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px}
.td-item.done{background:var(--alt);opacity:.5}
.td-txt{flex:1;font-size:13px;font-weight:500}
.td-item.done .td-txt{text-decoration:line-through;color:var(--muted)}
.td-chk{width:18px;height:18px;flex-shrink:0;border:1.5px solid var(--border);border-radius:50%;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;justify-content:center;font-size:10px}
.td-chk.on{background:var(--ok);border-color:var(--ok);color:white}
.td-del{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;opacity:.4}
.td-del:hover{opacity:1;color:var(--danger)}
.empty-msg{padding:32px;text-align:center;color:var(--muted);font-size:13px}

/* TIMELINE */
.tl-axis{display:flex;justify-content:space-between;font-size:10px;font-weight:600;color:var(--muted);margin-bottom:5px}
.tl-track{position:relative;height:56px;background:var(--alt);border-radius:8px;border:1px solid var(--border);overflow:hidden;margin-bottom:8px}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.6;z-index:3;pointer-events:none}
.tl-blk{position:absolute;top:7px;bottom:7px;border-radius:5px;opacity:.88;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:default;min-width:4px}
.tl-blk:hover{opacity:1}
.tl-blk span{font-size:10px;font-weight:700;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;pointer-events:none}
.tl-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.tl-leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.tl-leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* BAR CHART */
.bc-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bc-lbl{font-size:11px;color:var(--muted);font-weight:600;width:38px;flex-shrink:0;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-trk{flex:1;height:22px;background:var(--alt);border-radius:5px;overflow:hidden;position:relative;display:flex;align-items:center}
.bc-fil{height:100%;border-radius:5px;display:flex;align-items:center;transition:width .5s ease}
.bc-val{font-size:10px;font-weight:700;color:white;padding-left:6px;white-space:nowrap}
.bc-val-out{font-size:10px;font-weight:600;color:var(--muted);padding-left:4px;white-space:nowrap}

/* SETTINGS */
.set-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.set-lbl{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text)}
.set-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.set-sel{background:var(--alt);border:1px solid var(--border);border-radius:6px;padding:5px 8px;
  font-size:13px;font-weight:600;color:var(--text);outline:none;cursor:pointer}
.set-sel:focus{border-color:var(--accent)}
.set-preview{font-size:11px;color:var(--muted);margin-top:6px}
.preset-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;z-index:500;background:#0c0c0c;overflow:hidden}
.overlay.open{display:block}
.overlay.brk{background:#0a1a0f}
@keyframes scrnFlash{0%,100%{opacity:1}50%{opacity:.05}}
.overlay.flash{animation:scrnFlash .15s ease}

/* 게이지: 화면 꽉 채움 */
.pomo-wrap{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
}
.pomo-svg{
  width:min(90vw,90vh);height:min(90vw,90vh);
  transform:rotate(-90deg);
  display:block;
}
.pomo-trk{fill:none;stroke:#1c1c1c;stroke-width:7}
.pomo-fil{fill:none;stroke:#2563eb;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .4s}

/* 게이지 중앙 텍스트 */
.pomo-ctr{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;pointer-events:none;padding:0 40px;
}
.pomo-mode{
  font-size:11px;font-weight:700;letter-spacing:2px;
  padding:4px 12px;border-radius:20px;margin-bottom:10px;
  display:inline-block;
}
.pomo-mode.wk{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
.pomo-mode.bk{background:rgba(52,211,153,.15);color:#34d399}
.pomo-tname{
  font-size:clamp(16px,4vw,22px);font-weight:700;
  color:rgba(255,255,255,.8);line-height:1.4;
  word-break:keep-all;max-width:240px;
}
.pomo-rnd{
  font-size:13px;color:rgba(255,255,255,.25);
  margin-top:10px;font-weight:600;
  min-height:0;
}
.pomo-tip{
  font-size:13px;color:rgba(255,255,255,.28);
  margin-top:18px;font-weight:500;
  line-height:1.7;max-width:230px;
  word-break:keep-all;text-align:center;
}


/* 컨트롤 패널: 항상 표시 */
.ov-panel{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(0,0,0,.75);backdrop-filter:blur(12px);
  padding:20px 20px calc(env(safe-area-inset-bottom)+24px);
  z-index:9;border-radius:20px 20px 0 0;
  border-top:1px solid rgba(255,255,255,.06);
}

.ov-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:0}
.btn-ov{padding:12px 20px;border-radius:8px;border:none;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-ov.pause{background:rgba(255,255,255,.1);color:white}
.btn-ov.pause:hover{background:rgba(255,255,255,.18)}
.btn-ov.finish{background:var(--ok);color:white}
.btn-ov.finish:hover{filter:brightness(1.1)}
.btn-ov.skip{background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1)}
.btn-ov.skip:hover{color:rgba(255,255,255,.8)}
.btn-ov.cancel{background:transparent;color:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.08)}
.btn-ov.cancel:hover{color:rgba(255,255,255,.6)}
.ov-tip{display:none}

/* ALERT */
.alert{position:fixed;top:calc(env(safe-area-inset-top)+16px);left:50%;
  transform:translateX(-50%) translateY(-80px);background:var(--text);color:white;
  padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.18);transition:transform .3s;z-index:999;white-space:nowrap}
.alert.show{transform:translateX(-50%) translateY(0)}
.alert.ok{background:var(--ok)}
.alert.err{background:var(--danger)}

/* TOOLTIP */
.tooltip{position:fixed;z-index:600;background:#1a1a18;color:white;border-radius:8px;
  padding:8px 12px;font-size:12px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25);
  pointer-events:none;white-space:nowrap;display:none;line-height:1.5}

/* CUSTOM CONFIRM */
.cfm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:20px}
.cfm-box{background:var(--surface);border-radius:14px;padding:24px 20px 16px;
  max-width:300px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.cfm-msg{font-size:15px;font-weight:600;color:var(--text);text-align:center;
  line-height:1.5;margin-bottom:20px}
.cfm-btns{display:flex;gap:8px}
.cfm-cancel{flex:1;padding:11px;border:1px solid var(--border);border-radius:9px;
  background:var(--alt);color:var(--muted);font-family:inherit;font-size:14px;
  font-weight:600;cursor:pointer}
.cfm-ok{flex:1;padding:11px;border:none;border-radius:9px;
  background:var(--danger);color:white;font-family:inherit;font-size:14px;
  font-weight:700;cursor:pointer}

/* CALENDAR */
.cal-nav{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;
  padding:2px 8px;border-radius:6px;transition:color .15s;line-height:1}
.cal-nav:hover{color:var(--text)}
.cal-title{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);
  text-align:center;font-size:11px;font-weight:700;color:var(--muted);
  margin-bottom:4px}
.cal-weekdays span:first-child{color:#ef4444}
.cal-weekdays span:last-child{color:#2563eb}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{display:flex;flex-direction:column;align-items:center;
  padding:4px 2px;border-radius:8px;cursor:pointer;min-height:44px;
  transition:background .15s;position:relative}
.cal-cell:hover{background:var(--alt)}
.cal-cell.today .cal-num{background:var(--accent);color:white;border-radius:50%;
  width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.cal-cell.selected{background:var(--accent-light)}
.cal-cell.other-month .cal-num{color:var(--border)}
.cal-cell.sun .cal-num{color:#ef4444}
.cal-cell.sat .cal-num{color:#2563eb}
.cal-cell.today.sun .cal-num,.cal-cell.today.sat .cal-num{color:white}
.cal-num{font-size:13px;font-weight:600;width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;
  margin-top:2px;max-width:40px}
.cal-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

@keyframes flashAnim{0%{opacity:0;transform:scale(.5)}40%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1)}}
.flash-el{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:998;font-size:80px;opacity:0}
.flash-el.pop{animation:flashAnim .6s ease forwards}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-row">
    <div><h1 id="pgTitle">작업 타이머</h1><div class="dt" id="hdrDate"></div></div>
    <button class="btn-reset" id="btnReset">초기화</button>
  </div>
  <div class="day-wrap">
    <div class="day-labels"><span id="dlStart"></span><span id="dlMid"></span><span id="dlEnd"></span></div>
    <div class="day-track"><div class="day-fill" id="dayFill" style="width:0%"></div></div>
    <div class="day-rem" id="dayRem"></div>
  </div>
  <div class="prog-wrap">
    <div class="prog-bar">
      <div class="info"><span class="lbl">작업</span><span id="cntTask">0/0</span></div>
      <div class="trk"><div class="fil" id="filTask" style="width:0%"></div></div>
    </div>
    <div class="prog-bar">
      <div class="info"><span class="lbl">집중시간</span><span id="cntTime">0분</span></div>
      <div class="trk"><div class="fil" id="filTime" style="width:0%"></div></div>
    </div>
  </div>
</div>

<!-- PAGES -->
<div class="pages-outer" id="pgOuter">
  <div class="pages-inner" id="pgInner">

    <!-- 0: 타이머 -->
    <div class="pg">
      <div class="pg-inner">
        <div class="sec-title">⏱ 오늘 작업 <span style="font-size:12px;color:var(--muted);font-weight:500">최대 3개</span></div>
        <div id="taskList"></div>
        <button class="add-btn" id="addBtn" onclick="addTask()">+ 작업 추가</button>
        <div class="sec-title">📊 현황</div>
        <div class="sum-grid">
          <div class="sbox"><div class="sval" id="sDone">0</div><div class="slb">완료</div></div>
          <div class="sbox"><div class="sval" id="sTotal">0</div><div class="slb">전체</div></div>
          <div class="sbox"><div class="sval" id="sTime">0분</div><div class="slb">집중</div></div>
        </div>
        <div id="logWrap" style="display:none">

<div class="cfm-backdrop" id="cfmBackdrop" style="display:none">

<script>
// ── COLORS ────────────────────────────────────────────────────────────────────
const C = {
  blue:  {main:'#2563eb',light:'#dbeafe',border:'#93bbfd',stroke:'#3b82f6'},
  green: {main:'#16a34a',light:'#dcfce7',border:'#86efac',stroke:'#22c55e'},
  orange:{main:'#f97316',light:'#fff3e0',border:'#fed7aa',stroke:'#fb923c'},
  red:   {main:'#dc2626',light:'#fee2e2',border:'#fca5a5',stroke:'#ef4444'},
  purple:{main:'#7c3aed',light:'#ede9fe',border:'#c4b5fd',stroke:'#8b5cf6'},
};
const CK = Object.keys(C);
const DEF_C = 'blue';
const BREAK_STROKE = '#34d399';
const TIPS = [
  '"완벽한 준비란 없다. 시작이 준비다."',
  '"지금 당장 할 수 없어도, 지금 당장 시작할 수는 있다."',
  '"5분만 해보자. 딱 5분."',
  '"집중은 근육이다. 쓸수록 강해진다."',
  '"미루는 건 쉽다. 시작하는 게 전부다."',
  '"머릿속 소음은 무시해도 된다. 손만 움직여라."',
  '"완성이 완벽보다 낫다."',
  '"지금 이 순간만 존재한다."',
  '"어수선한 생각은 잠시 내려두자. 지금 여기에."',
  '"작은 진전도 진전이다."',
  '"할 마음이 없어도 괜찮다. 몸만 앉아 있어라."',
  '"산만함은 적이 아니다. 다시 돌아오는 것이 집중이다."',
  '"생각이 많으면 일단 적어라. 그리고 닫아라."',
  '"최고의 계획은 지금 하는 것이다."',
  '"오늘 1%가 내일을 바꾼다."',
];
const CIRC = 2 * Math.PI * 44;

// ── STORAGE ───────────────────────────────────────────────────────────────────
const SK = 'fapp_v7', DSK = 'fapp_ds';
function todayStr(){ return new Date().toISOString().slice(0,10); }
function defState(){ return {date:todayStr(),tasks:[],sessions:[],todos:[]}; }
function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem(SK));
    if(!s) return defState();
    if(s.date!==todayStr()) return {...defState(),todos:s.todos||[]};
    return s;
  }catch{return defState();}
}
function save(){ localStorage.setItem(SK,JSON.stringify(st)); }
function loadDS(){ try{return JSON.parse(localStorage.getItem(DSK))||{sh:6,sm:0,eh:19,em:0};}catch{return{sh:6,sm:0,eh:19,em:0};} }
function saveDS(){
  const ds={sh:+stSH.value,sm:+stSM.value,eh:+stEH.value,em:+stEM.value};
  localStorage.setItem(DSK,JSON.stringify(ds));
  updateDayGauge(); updateSetPreview();
}

let st = loadState();

// ── UTILS ─────────────────────────────────────────────────────────────────────
const pad = n => String(n).padStart(2,'0');
function fmtS(s){ s=Math.floor(Math.abs(s)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60; return h?`${pad(h)}:${pad(m)}:${pad(ss)}`:`${pad(m)}:${pad(ss)}`; }
function fmtM(s){ const m=Math.floor(s/60); if(!m)return '0분'; return m>=60?`${Math.floor(m/60)}시간 ${m%60}분`:`${m}분`; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getC(c){ return C[c]||C[DEF_C]; }
function fmtHM(h,m){ const ap=h<12?'오전':'오후',h12=h%12||12; return `${ap} ${h12}시${m?` ${m}분`:''}`; }

// ── DATE HEADER ───────────────────────────────────────────────────────────────
(function(){
  const d=new Date(),days=['일','월','화','수','목','금','토'];
  document.getElementById('hdrDate').textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
})();

// ── DAY GAUGE ─────────────────────────────────────────────────────────────────
function updateDayGauge(){
  const ds=loadDS();
  const now=new Date(), nm=now.getHours()*60+now.getMinutes();
  const s0=ds.sh*60+ds.sm, e0=ds.eh*60+ds.em, rng=e0-s0;
  const pct=Math.min(100,Math.max(0,(nm-s0)/rng*100));
  document.getElementById('dayFill').style.width=pct.toFixed(2)+'%';
  // labels
  document.getElementById('dlStart').textContent=fmtHM(ds.sh,ds.sm);
  const midM=Math.round((s0+e0)/2);
  document.getElementById('dlMid').textContent=fmtHM(Math.floor(midM/60),midM%60);
  document.getElementById('dlEnd').textContent=fmtHM(ds.eh,ds.em);
  // remaining
  const rem=Math.max(0,e0-nm),rh=Math.floor(rem/60),rm=rem%60;
  document.getElementById('dayRem').textContent=
    nm<s0?`당신의 하루가 ${rh}시간 ${pad(rm)}분 남았습니다.`:
    nm>=e0?'오늘 하루 끝 🌙':
    `당신의 하루가 ${rh}시간 ${pad(rm)}분 남았습니다.`;
}
updateDayGauge();
setInterval(updateDayGauge,60000);

// ── PAGES / SWIPE ─────────────────────────────────────────────────────────────
const pgInner = document.getElementById('pgInner');
const pgOuter = document.getElementById('pgOuter');
const TITLES = ['작업 타이머','할 일 목록','기록','설정'];
let curPg = 0;

function goPage(i){
  curPg = i;
  // Each page is 100vw; track is 400vw → shift by i*100vw
  pgInner.style.transform = `translateX(${-i*100}vw)`;
  pgInner.style.width = '400vw';
  document.querySelectorAll('.nav-btn').forEach((b,j)=>b.classList.toggle('on',j===i));
  document.getElementById('pgTitle').textContent = TITLES[i];
  document.getElementById('btnReset').style.display = i===0?'':'none';
  if(i===1) renderTodos();
  if(i===2) renderTimeline();
  if(i===3) renderSettings();
}
// init width
pgInner.style.width = '400vw';

let tx=0,ty=0,sw=false;
pgOuter.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;sw=false;},{passive:true});
pgOuter.addEventListener('touchmove',e=>{
  const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;
  if(!sw&&Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10)sw=true;
  if(sw)e.preventDefault();
},{passive:false});
pgOuter.addEventListener('touchend',e=>{
  if(!sw)return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50)goPage(dx<0?Math.min(3,curPg+1):Math.max(0,curPg-1));
});

// ── RESET ─────────────────────────────────────────────────────────────────────
document.getElementById('btnReset').addEventListener('click',()=>{
  // confirm()이 PWA/로컬 환경에서 막힐 수 있어 직접 구현
  showConfirm('오늘 작업과 기록을 초기화할까요?', ()=>{
    stopClean();
    const todos=st.todos; st=defState(); st.todos=todos;
    save(); renderAll();
    if(st.tasks.length===0) addTask();
    toast('초기화 완료','ok');
  });
});

// ── TASKS ─────────────────────────────────────────────────────────────────────
function addTask(){
  if(st.tasks.length>=3){toast('최대 3개까지 추가할 수 있어요','err');return;}
  st.tasks.push({id:Date.now(),name:'',goalMin:25,breakMin:5,rounds:1,done:false,actualSec:0,color:DEF_C});
  save(); renderTasks();
  setTimeout(()=>{const a=document.querySelectorAll('.tname');if(a.length)a[a.length-1].focus();},40);
}
function setField(id,f,v){const t=st.tasks.find(t=>t.id===id);if(t){t[f]=v;save();}}
function setColor(id,c){const t=st.tasks.find(t=>t.id===id);if(t){t.color=c;save();renderTasks();}}
function toggleDone(id){
  const t=st.tasks.find(t=>t.id===id);if(!t)return;
  if(st.tasks.indexOf(t)===tiIdx){toast('타이머를 완료하거나 취소 후 체크하세요','err');return;}
  t.done=!t.done;save();renderAll();if(t.done)flashCheck();
}
function delTask(id){
  const i=st.tasks.findIndex(t=>t.id===id);
  if(i===tiIdx){toast('진행 중인 작업은 삭제할 수 없어요','err');return;}
  st.tasks.splice(i,1);save();renderAll();
}

// ── TIMER STATE ───────────────────────────────────────────────────────────────
let timerRAF=null,tiElapsed=0,tiGoal=0,tiPaused=false,tiIdx=null;
let tickBase=null,ePause=0,isBreak=false,curRound=0,totRounds=1,breakSec=0;

function startTimer(i){
  const t=st.tasks[i];
  if(!t.name.trim()){toast('작업명을 먼저 입력해주세요','err');return;}
  if(timerRAF){toast('진행 중인 타이머가 있어요','err');return;}
  tiIdx=i; totRounds=Math.max(1,parseInt(t.rounds)||1);
  breakSec=(parseInt(t.breakMin)||5)*60; curRound=1; isBreak=false;
  startPhase(t.goalMin*60,false,t);
}
function startPhase(dur,brk,t){
  isBreak=brk; tiGoal=dur; tiElapsed=0; ePause=0; tiPaused=false; tickBase=performance.now();
  const task=t||st.tasks[tiIdx], col=getC(task.color);
  const fil=document.getElementById('pomoFil');
  fil.style.strokeDasharray=CIRC; fil.style.strokeDashoffset=0;
  fil.style.stroke=isBreak?BREAK_STROKE:col.stroke;
  document.getElementById('oName').textContent=task.name;
  document.getElementById('oMode').textContent=isBreak?'휴식':'집중';
  document.getElementById('oMode').className='pomo-mode '+(isBreak?'bk':'wk');
  document.getElementById('oRound').textContent=totRounds>1?`${curRound}/${totRounds} 라운드`:'';
  document.getElementById('oPause').textContent='⏸ 일시정지';
  document.getElementById('oTip').textContent=isBreak?'잠깐 쉬어요 ☕':TIPS[Math.floor(Math.random()*TIPS.length)];
  const ov=document.getElementById('overlay');
  ov.classList.add('open'); ov.classList.toggle('brk',isBreak);
  if(timerRAF){cancelAnimationFrame(timerRAF);timerRAF=null;}
  timerRAF=requestAnimationFrame(tick);
}
function tick(){
  if(!tiPaused)tiElapsed=ePause+(performance.now()-tickBase)/1000;
  const rem=tiGoal-tiElapsed;
  const fil=document.getElementById('pomoFil');
  if(rem>=0){
    fil.style.strokeDashoffset=CIRC*(1-rem/tiGoal);
  } else {
    onPhaseEnd(); return;
  }
  timerRAF=requestAnimationFrame(tick);
}
function onPhaseEnd(){
  playBeep(); flashScreen(5);
  if(isBreak){
    curRound++;
    if(curRound>totRounds){ finishAll(); }
    else{ const t=st.tasks[tiIdx]; toast(`🎯 ${curRound}/${totRounds} 라운드 시작!`,'ok'); setTimeout(()=>startPhase(t.goalMin*60,false,t),400); }
  } else {
    if(curRound>=totRounds){ finishAll(); }
    else{ toast(`☕ 휴식 ${st.tasks[tiIdx].breakMin}분`,'ok'); setTimeout(()=>startPhase(breakSec,true,null),400); }
  }
}
function skipPhase(){ if(timerRAF){cancelAnimationFrame(timerRAF);timerRAF=null;} onPhaseEnd(); }
function togglePause(){
  tiPaused=!tiPaused;
  if(tiPaused){ePause+=(performance.now()-tickBase)/1000;document.getElementById('oPause').textContent='▶ 재개';}
  else{tickBase=performance.now();document.getElementById('oPause').textContent='⏸ 일시정지';}
}
function finishAll(){
  if(timerRAF){cancelAnimationFrame(timerRAF);timerRAF=null;}
  const t=st.tasks[tiIdx], sec=totRounds*t.goalMin*60;
  st.sessions.push({id:Date.now(),taskId:t.id,name:t.name,seconds:sec,endedAt:new Date().toTimeString().slice(0,5),color:t.color});
  t.actualSec=(t.actualSec||0)+sec; t.done=true;
  save(); stopClean(); flashCheck(); toast(`✓ ${t.name} 완료 — ${fmtM(sec)} 집중`,'ok'); renderAll();
}
function cancelTimer(){ stopClean(); renderTasks(); }
function stopClean(){
  if(timerRAF){cancelAnimationFrame(timerRAF);timerRAF=null;}
  tiIdx=null;tiElapsed=0;ePause=0;tiPaused=false;isBreak=false;
  document.getElementById('overlay').classList.remove('open','brk');
}

// ── SOUND & FLASH ─────────────────────────────────────────────────────────────
let actx=null;
function playBeep(){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    [784,659,523].forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.connect(g);g.connect(actx.destination);o.type='sine';o.frequency.value=f;
      const t=actx.currentTime+i*.18;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.05);g.gain.linearRampToValueAtTime(0,t+.25);
      o.start(t);o.stop(t+.3);
    });
  }catch(e){}
}
function flashScreen(n){
  const ov=document.getElementById('overlay');let c=0;
  const iv=setInterval(()=>{ov.classList.add('flash');setTimeout(()=>ov.classList.remove('flash'),150);if(++c>=n)clearInterval(iv);},350);
}

// ── RENDER TASKS ──────────────────────────────────────────────────────────────
function renderTasks(){
  const list=document.getElementById('taskList'); list.innerHTML='';
  st.tasks.forEach((t,i)=>{
    const act=tiIdx===i, col=getC(t.color);
    const card=document.createElement('div');
    card.className='task-card'+(act?' act':'')+(t.done?' done':'');
    if(act){card.style.setProperty('--_cl',col.light);card.style.setProperty('--_cb',col.border);}
    const badge=t.actualSec
      ?`<span class="bdg" style="color:${col.main};background:${col.light};border:1px solid ${col.border}">${fmtS(t.actualSec)}</span>`
      :`<span class="bdg bdg-g">${t.goalMin}분×${t.rounds||1}</span>`;
    const del=(!t.done&&!act&&!timerRAF)?`<button class="tdel" onclick="delTask(${t.id})">✕</button>`:'';
    const chkSt=t.done?`background:${col.main};border-color:${col.main};`:'';
    let bot='';
    if(!t.done&&!act){
      const pal=CK.map(c=>`<div class="cdot${t.color===c?' sel':''}" style="background:${C[c].main}" onclick="setColor(${t.id},'${c}')"></div>`).join('');
      bot=`<div class="tbottom">
        <div class="srow"><div class="palette">${pal}</div></div>
        <div class="srow">
          <span class="slbl">집중</span>
          <input class="sinp" type="number" min="1" max="120" value="${t.goalMin}" onchange="setField(${t.id},'goalMin',Math.max(1,+this.value||25))">
          <span class="slbl">분</span>
          <span class="slbl" style="margin-left:6px">쉬는</span>
          <input class="sinp" type="number" min="0" max="60" value="${t.breakMin||5}" onchange="setField(${t.id},'breakMin',Math.max(0,+this.value||5))">
          <span class="slbl">분</span>
          <span class="slbl" style="margin-left:6px">횟수</span>
          <input class="sinp" type="number" min="1" max="10" value="${t.rounds||1}" onchange="setField(${t.id},'rounds',Math.max(1,+this.value||1))">
          <button class="btn-go" style="background:${col.main}" onclick="startTimer(${i})" ${timerRAF?'disabled':''}>▶ 시작</button>
        </div>
      </div>`;
    }
    card.innerHTML=`
      <div class="tclr-bar" style="background:${col.main}"></div>
      <div class="thead">
        <span class="tnum">${i+1}</span>
        <div class="tchk${t.done?' on':''}" style="${chkSt}" onclick="toggleDone(${t.id})">${t.done?'✓':''}</div>
        <input class="tname" type="text" placeholder="작업명 입력..." value="${esc(t.name)}"
          oninput="setField(${t.id},'name',this.value)" ${act||t.done?'readonly':''}>
        ${badge}${del}
      </div>${bot}`;
    list.appendChild(card);
  });
  document.getElementById('addBtn').style.display=st.tasks.length>=3?'none':'block';
}

// ── RENDER SUMMARY ────────────────────────────────────────────────────────────
function renderSummary(){
  const done=st.tasks.filter(t=>t.done).length,tot=st.tasks.length;
  const tSec=st.sessions.reduce((a,s)=>a+s.seconds,0);
  const gSec=st.tasks.reduce((a,t)=>a+(t.goalMin*(t.rounds||1)*60),0);
  document.getElementById('sDone').textContent=done;
  document.getElementById('sTotal').textContent=tot;
  document.getElementById('sTime').textContent=fmtM(tSec);
  const tp=tot>0?done/tot*100:0;
  document.getElementById('filTask').style.width=tp+'%';
  document.getElementById('filTask').className='fil'+(tp>=100?' done':'');
  document.getElementById('cntTask').textContent=`${done}/${tot}`;
  const tp2=gSec>0?Math.min(100,tSec/gSec*100):0;
  document.getElementById('filTime').style.width=tp2+'%';
  document.getElementById('cntTime').textContent=fmtM(tSec);
}

// ── RENDER LOG ────────────────────────────────────────────────────────────────
function renderLog(){
  const wrap=document.getElementById('logWrap'),ul=document.getElementById('logUl');
  if(!st.sessions.length){wrap.style.display='none';return;}
  wrap.style.display='block';
  ul.innerHTML=st.sessions.map(s=>{
    const col=getC(s.color||DEF_C);
    return `<li class="log-li">
      <span class="log-t">${s.endedAt}</span>
      <span class="log-n">${esc(s.name)}</span>
      <span class="log-d" style="color:${col.main};background:${col.light};border:1px solid ${col.border}">${fmtS(s.seconds)}</span>
      <button class="log-x" onclick="delLog(${s.id})">✕</button>
    </li>`;
  }).join('');
}
function delLog(id){ st.sessions=st.sessions.filter(s=>s.id!==id); save(); renderLog(); renderSummary(); }
function clearAllLogs(){ showConfirm('모든 세션 로그를 삭제할까요?', ()=>{ st.sessions=[]; save(); renderAll(); }); }
function renderAll(){ renderTasks(); renderSummary(); renderLog(); if(curPg===2)renderTimeline(); }

// ── CALENDAR & RECORDING ─────────────────────────────────────────────────────
// 달력에서 사용할 히스토리 저장 (날짜별 세션 누적)
const HSK = 'fapp_hist'; // {YYYY-MM-DD: [{name,seconds,color,endedAt}]}
function loadHist(){ try{return JSON.parse(localStorage.getItem(HSK))||{};}catch{return{};} }
function saveHist(){
  const h=loadHist();
  h[todayStr()]=st.sessions;
  localStorage.setItem(HSK,JSON.stringify(h));
}

// save() 를 호출할 때마다 히스토리도 같이 저장
const _origSave=save;
save=function(){ _origSave(); saveHist(); };

let calYear=new Date().getFullYear(), calMonth=new Date().getMonth();
let calSelected=todayStr();

function calMove(d){
  calMonth+=d;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
}

function renderTimeline(){
  renderCalendar();
  renderCalDetail(calSelected);
  renderMonthTaskBars();
}

function renderCalendar(){
  const hist=loadHist();
  const title=`${calYear}년 ${calMonth+1}월`;
  document.getElementById('calTitle').textContent=title;

  const grid=document.getElementById('calGrid');
  grid.innerHTML='';

  const today=todayStr();
  const firstDay=new Date(calYear,calMonth,1).getDay(); // 0=일
  const lastDate=new Date(calYear,calMonth+1,0).getDate();

  // 이전달 빈칸
  for(let i=0;i<firstDay;i++){
    const prev=new Date(calYear,calMonth,0-firstDay+i+1);
    const cell=makeCalCell(prev.getFullYear(),prev.getMonth(),prev.getDate(),hist,today,true);
    grid.appendChild(cell);
  }
  // 이번달
  for(let d=1;d<=lastDate;d++){
    const cell=makeCalCell(calYear,calMonth,d,hist,today,false);
    grid.appendChild(cell);
  }
  // 다음달 빈칸
  const total=firstDay+lastDate;
  const remain=(7-total%7)%7;
  for(let d=1;d<=remain;d++){
    const next=new Date(calYear,calMonth+1,d);
    const cell=makeCalCell(next.getFullYear(),next.getMonth(),next.getDate(),hist,today,true);
    grid.appendChild(cell);
  }
}

function makeCalCell(y,m,d,hist,today,otherMonth){
  const key=`${y}-${pad(m+1)}-${pad(d)}`;
  const sessions=key===todayStr()?st.sessions:(hist[key]||[]);
  const dow=new Date(y,m,d).getDay();

  const cell=document.createElement('div');
  const classes=['cal-cell'];
  if(otherMonth) classes.push('other-month');
  if(key===today) classes.push('today');
  if(key===calSelected) classes.push('selected');
  if(dow===0) classes.push('sun');
  if(dow===6) classes.push('sat');
  cell.className=classes.join(' ');

  const num=document.createElement('div');
  num.className='cal-num';
  num.textContent=d;
  cell.appendChild(num);

  // 색상 점
  if(sessions.length){
    const dotsWrap=document.createElement('div');
    dotsWrap.className='cal-dots';
    // 중복 색 제거, 최대 4개
    const seen=new Set();
    sessions.forEach(s=>{
      if(seen.has(s.color||DEF_C)||seen.size>=4)return;
      seen.add(s.color||DEF_C);
      const dot=document.createElement('div');
      dot.className='cal-dot';
      dot.style.background=getC(s.color||DEF_C).main;
      dotsWrap.appendChild(dot);
    });
    cell.appendChild(dotsWrap);
  }

  cell.onclick=()=>{
    calSelected=key;
    renderCalendar();
    renderCalDetail(key);
  };
  return cell;
}

function renderCalDetail(key){
  const hist=loadHist();
  const sessions=key===todayStr()?st.sessions:(hist[key]||[]);
  const card=document.getElementById('calDetailCard');
  const titleEl=document.getElementById('calDetailTitle');
  const totalEl=document.getElementById('calDetailTotal');

  card.style.display='block';
  const [y,m,d]=key.split('-');
  titleEl.textContent=`${+m}월 ${+d}일`;

  const ds=loadDS();
  const s0=ds.sh*60+ds.sm, e0=ds.eh*60+ds.em, rng=e0-s0;
  const trk=document.getElementById('tlTrack');
  const axis=document.getElementById('tlAxis');
  const leg=document.getElementById('tlLegend');
  const emp=document.getElementById('tlEmpty');
  const nowEl=document.getElementById('tlNow');

  Array.from(trk.children).forEach(c=>{if(!c.classList.contains('tl-now'))c.remove();});
  axis.innerHTML=''; leg.innerHTML='';

  // 오늘이면 현재 시간선 표시
  if(key===todayStr()){
    const now=new Date(),nm=now.getHours()*60+now.getMinutes();
    nowEl.style.display='block';
    nowEl.style.left=Math.min(100,Math.max(0,(nm-s0)/rng*100)).toFixed(2)+'%';
  } else {
    nowEl.style.display='none';
  }

  // 축
  for(let i=0;i<=4;i++){
    const mm=s0+(rng/4)*i,h=Math.floor(mm/60),mn=Math.round(mm%60);
    const sp=document.createElement('span');
    sp.textContent=mn?`${h}:${pad(mn)}`:`${h}시`;
    axis.appendChild(sp);
  }

  if(!sessions.length){
    emp.style.display='block'; trk.style.opacity='.5';
    totalEl.textContent=''; return;
  }
  emp.style.display='none'; trk.style.opacity='1';

  const tSec=sessions.reduce((a,s)=>a+s.seconds,0);
  totalEl.textContent=fmtM(tSec);

  const tip=document.getElementById('tooltip');
  const seen=new Set();
  const nowM=new Date().getHours()*60+new Date().getMinutes();

  sessions.forEach(s=>{
    const col=getC(s.color||DEF_C);
    const durMin=s.seconds/60;
    let endM=nowM;
    if(s.endedAt){const[hh,mm]=s.endedAt.split(':').map(Number);endM=hh*60+mm;}
    const startM=endM-durMin;
    const lPct=Math.max(0,(startM-s0)/rng*100);
    const wPct=Math.min(100-lPct,durMin/rng*100);
    if(wPct<=0)return;

    const blk=document.createElement('div');
    blk.className='tl-blk';
    blk.style.left=lPct.toFixed(2)+'%';
    blk.style.width=wPct.toFixed(2)+'%';
    blk.style.background=col.main;
    const lbl=document.createElement('span');
    lbl.textContent=wPct>8?s.name:'';
    blk.appendChild(lbl);
    blk.addEventListener('mouseenter',()=>{
      tip.innerHTML=`<b>${esc(s.name)}</b><br>${s.endedAt||''} · ${fmtS(s.seconds)}`;
      tip.style.display='block';
    });
    blk.addEventListener('mousemove',e=>{tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-44)+'px';});
    blk.addEventListener('mouseleave',()=>{tip.style.display='none';});
    trk.appendChild(blk);

    if(!seen.has(s.name)){
      seen.add(s.name);
      const li=document.createElement('div'); li.className='tl-leg-item';
      li.innerHTML=`<div class="tl-leg-dot" style="background:${col.main}"></div><span>${esc(s.name)}</span>`;
      leg.appendChild(li);
    }
  });
}

function renderMonthTaskBars(){
  const el=document.getElementById('taskBars');
  const hist=loadHist();
  const map={};
  // 이달 전체 합산
  const prefix=`${calYear}-${pad(calMonth+1)}`;
  Object.entries(hist).forEach(([day,sessions])=>{
    if(!day.startsWith(prefix)) return;
    sessions.forEach(s=>{
      if(!map[s.name])map[s.name]={sec:0,color:s.color||DEF_C};
      map[s.name].sec+=s.seconds;
    });
  });
  // 오늘이 이번달이면 오늘 데이터도 포함
  if(todayStr().startsWith(prefix)){
    st.sessions.forEach(s=>{
      if(!map[s.name])map[s.name]={sec:0,color:s.color||DEF_C};
      map[s.name].sec+=s.seconds;
    });
  }
  const ents=Object.entries(map).sort((a,b)=>b[1].sec-a[1].sec);
  if(!ents.length){el.innerHTML='<div class="empty-msg" style="padding:16px">이달 데이터 없음</div>';return;}
  const mx=ents[0][1].sec;
  el.innerHTML=ents.map(([n,{sec,color}])=>{
    const col=getC(color),pct=(sec/mx*100).toFixed(1),show=+pct>15;
    return `<div class="bc-row">
      <div class="bc-lbl" title="${esc(n)}">${esc(n.length>5?n.slice(0,5)+'…':n)}</div>
      <div class="bc-trk">
        <div class="bc-fil" style="width:${pct}%;background:linear-gradient(90deg,${col.main},${col.stroke})">
          ${show?`<span class="bc-val">${fmtM(sec)}</span>`:''}
        </div>
        ${!show?`<span class="bc-val-out">${fmtM(sec)}</span>`:''}
      </div>
    </div>`;
  }).join('');
}


// ── RENDER TODOS ──────────────────────────────────────────────────────────────
function addTodo(){
  const inp=document.getElementById('todoInp'),tx=inp.value.trim();if(!tx)return;
  st.todos.push({id:Date.now(),text:tx,done:false});inp.value='';save();renderTodos();
}
function togTodo(id){const t=st.todos.find(t=>t.id===id);if(t){t.done=!t.done;save();renderTodos();}}
function delTodo(id){st.todos=st.todos.filter(t=>t.id!==id);save();renderTodos();}
function clearDoneTodos(){st.todos=st.todos.filter(t=>!t.done);save();renderTodos();}
function renderTodos(){
  const el=document.getElementById('todoList');
  if(!st.todos.length){el.innerHTML='<div class="empty-msg">할 일을 추가해보세요</div>';return;}
  el.innerHTML=[...st.todos].sort((a,b)=>a.done-b.done).map(t=>`
    <div class="td-item ${t.done?'done':''}">
      <div class="td-chk ${t.done?'on':''}" onclick="togTodo(${t.id})">${t.done?'✓':''}</div>
      <span class="td-txt">${esc(t.text)}</span>
      <button class="td-del" onclick="delTodo(${t.id})">✕</button>
    </div>`).join('');
}

// ── RENDER SETTINGS ───────────────────────────────────────────────────────────
const stSH=document.getElementById('stSH'),stSM=document.getElementById('stSM');
const stEH=document.getElementById('stEH'),stEM=document.getElementById('stEM');

function renderSettings(){
  const ds=loadDS();
  if(!stSH.options.length){
    for(let i=0;i<=23;i++){[stSH,stEH].forEach(s=>{const o=document.createElement('option');o.value=i;o.textContent=i+'시';s.appendChild(o);});}
    [0,10,20,30,40,50].forEach(m=>{[stSM,stEM].forEach(s=>{const o=document.createElement('option');o.value=m;o.textContent=pad(m)+'분';s.appendChild(o);});});
  }
  stSH.value=ds.sh;stSM.value=ds.sm;stEH.value=ds.eh;stEM.value=ds.em;
  updateSetPreview();
}
function updateSetPreview(){
  const ds=loadDS();
  const tot=(ds.eh*60+ds.em)-(ds.sh*60+ds.sm);
  const h=Math.floor(tot/60),m=tot%60;
  document.getElementById('setPreview').textContent=
    `${fmtHM(ds.sh,ds.sm)} → ${fmtHM(ds.eh,ds.em)}  (총 ${h?h+'시간 ':''}${m?m+'분':''})`;
}
function applyPreset(sh,sm,eh,em){
  localStorage.setItem(DSK,JSON.stringify({sh,sm,eh,em}));
  renderSettings(); updateDayGauge(); toast('적용됨','ok');
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
let alertT=null;
function toast(msg,type='ok'){
  const el=document.getElementById('alert');
  el.textContent=msg;el.className=`alert show ${type}`;
  clearTimeout(alertT);alertT=setTimeout(()=>el.classList.remove('show'),2800);
}
function showConfirm(msg, onOk){
  const bd=document.getElementById('cfmBackdrop');
  document.getElementById('cfmMsg').textContent=msg;
  bd.style.display='flex';
  const ok=document.getElementById('cfmOk');
  const cancel=document.getElementById('cfmCancel');
  const close=()=>{ bd.style.display='none'; ok.onclick=null; cancel.onclick=null; };
  ok.onclick=()=>{ close(); onOk(); };
  cancel.onclick=()=>{ close(); };
}
function flashCheck(){const el=document.getElementById('flashEl');el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function exportLog(){
  const lines=[`오늘의 작업 ${todayStr()}\n`];
  st.tasks.forEach((t,i)=>{
    const s=t.done?'V':'O',tm=t.actualSec?` (${fmtS(t.actualSec)})`:'';
    lines.push(`${s} ${i+1}. ${t.name||'무제'}${tm}`);
  });
  if(st.sessions.length){lines.push('\n세션 로그:');st.sessions.forEach(s=>lines.push(`  ${s.endedAt}  ${s.name}  ${fmtS(s.seconds)}`));}
  const tot=st.sessions.reduce((a,s)=>a+s.seconds,0);
  if(tot)lines.push(`\n총 집중: ${fmtM(tot)}`);
  navigator.clipboard.writeText(lines.join('\n')).then(()=>toast('클립보드에 복사됨','ok')).catch(()=>toast('복사 실패','err'));
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderAll();
if(st.tasks.length===0)addTask();
</script>
